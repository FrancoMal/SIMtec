# Copiar como .github/workflows/security.yml
# Las acciones usan tags mayores como ejemplo: revisarlas y actualizarlas
# periódicamente según la política de la organización.
name: Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks - secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep - SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: auto

  trivy:
    name: Trivy - vulnerabilidades críticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reemplazar por la versión o digest aprobado por el equipo.
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # Este job es opcional y sólo se habilita después de probar los checks.
  # Requiere configurar COOLIFY_DEPLOY_WEBHOOK y COOLIFY_API_TOKEN dentro
  # del Environment "production", además de sus revisores requeridos.
  deploy:
    name: Deploy a production
    needs: [gitleaks, semgrep, trivy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Validar secretos de deploy
        shell: bash
        run: |
          test -n "$COOLIFY_DEPLOY_WEBHOOK"
          test -n "$COOLIFY_API_TOKEN"
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      - name: Solicitar deploy autenticado
        shell: bash
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          status="$(curl -sS -o response.txt -w "%{http_code}" \
            --connect-timeout 5 --max-time 60 \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -X POST "$COOLIFY_DEPLOY_WEBHOOK")"
          echo "Coolify webhook HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "El deploy fue rechazado. Respuesta sanitizada:"
            head -c 500 response.txt | sed -E 's/[A-Za-z0-9_=-]{30,}/[REDACTED]/g'
            exit 1
          fi
